name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v0.1.0"
        required: true
        type: string
      title:
        description: "Release title. Defaults to the tag."
        required: false
        type: string
      changelog:
        description: "Manual release notes. Leave blank to generate from commit subjects."
        required: false
        type: string
      include_pattern:
        description: "Optional regex for commit subjects to include in generated notes."
        required: false
        type: string
      exclude_pattern:
        description: "Regex for commit subjects to exclude from generated notes."
        required: false
        default: "(^chore\\(release\\):|\\[skip changelog\\])"
        type: string
      update_changelog:
        description: "Append the generated notes to CHANGELOG.md before tagging."
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release-notes:
    name: Prepare Release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.final.outputs.tag }}
      title: ${{ steps.final.outputs.title }}
      body: ${{ steps.notes.outputs.body }}
      ref: ${{ steps.final.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
            title="${{ inputs.title }}"
          else
            tag="${GITHUB_REF_NAME}"
            title="${GITHUB_REF_NAME}"
          fi

          if [ -z "$title" ]; then
            title="$tag"
          fi

          {
            echo "tag=$tag"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: notes
        shell: bash
        env:
          MANUAL_CHANGELOG: ${{ inputs.changelog }}
          INCLUDE_PATTERN: ${{ inputs.include_pattern }}
          EXCLUDE_PATTERN: ${{ inputs.exclude_pattern }}
        run: |
          manual_notes="$MANUAL_CHANGELOG"
          if [ -n "$manual_notes" ]; then
            {
              echo "body<<EOF"
              printf '%s\n' "$manual_notes"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="${{ steps.release.outputs.tag }}"
          include_pattern="$INCLUDE_PATTERN"
          exclude_pattern="$EXCLUDE_PATTERN"

          if git rev-parse "$tag^{commit}" >/dev/null 2>&1; then
            previous_tag="$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)"
            end_ref="$tag"
          else
            previous_tag="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
            end_ref="HEAD"
          fi

          if [ -n "$previous_tag" ]; then
            range="$previous_tag..$end_ref"
            range_label="$previous_tag..$tag"
          else
            range="$end_ref"
            range_label="$tag"
          fi

          mapfile -t commits < <(git log --format=%s "$range")

          notes=()
          for subject in "${commits[@]}"; do
            if [ -n "$include_pattern" ] && ! grep -Eq "$include_pattern" <<< "$subject"; then
              continue
            fi
            if [ -n "$exclude_pattern" ] && grep -Eq "$exclude_pattern" <<< "$subject"; then
              continue
            fi
            notes+=("- $subject")
          done

          {
            echo "body<<EOF"
            echo "Changes in $range_label"
            echo
            if [ "${#notes[@]}" -eq 0 ]; then
              echo "- No user-facing changes selected."
            else
              printf '%s\n' "${notes[@]}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Append CHANGELOG.md and create tag
        if: github.event_name == 'workflow_dispatch' && inputs.update_changelog
        shell: bash
        env:
          RELEASE_NOTES: ${{ steps.notes.outputs.body }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if git rev-parse "$tag^{commit}" >/dev/null 2>&1; then
            echo "Tag $tag already exists. Use a new tag, or turn off update_changelog to build an existing tag." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          printf '%s\n' "$RELEASE_NOTES" > /tmp/release-notes.md

          bash scripts/update-changelog.sh "$tag" /tmp/release-notes.md

          if ! git diff --quiet -- CHANGELOG.md; then
            git add CHANGELOG.md
            git commit -m "chore(release): update changelog for $tag"
          fi

          git tag "$tag"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "$tag"

      - name: Resolve build ref
        id: final
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          title="${{ steps.release.outputs.title }}"

          if git rev-parse "$tag^{commit}" >/dev/null 2>&1; then
            ref="$tag"
          else
            ref="${GITHUB_SHA}"
          fi

          {
            echo "tag=$tag"
            echo "title=$title"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }} Installer
    needs: release-notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-notes.outputs.ref }}
          fetch-depth: 0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.release-notes.outputs.tag }}
          releaseName: ${{ needs.release-notes.outputs.title }}
          releaseBody: ${{ needs.release-notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          releaseCommitish: ${{ needs.release-notes.outputs.ref }}
